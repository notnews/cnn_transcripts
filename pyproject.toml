[project]
name = "cnn-transcripts"
description = "Scraper and provenance record for the CNN Transcripts 2000--2025 corpus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
requires-python = ">=3.12"
version = "1.0.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "pyarrow>=21",
    "pyDataverse>=0.3.5",
    "python-dateutil>=2.9",
    "scrapelib>=2.4",
]

[project.urls]
Homepage = "https://github.com/notnews/cnn_transcripts"
Repository = "https://github.com/notnews/cnn_transcripts"
Data = "https://doi.org/10.7910/DVN/ISDPJU"

[project.scripts]
cnn-transcripts = "cnn_transcripts.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cnn_transcripts"

[dependency-groups]
dev = [
    "ruff>=0.14",
    { include-group = "test" },
]
test = ["pytest>=8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
